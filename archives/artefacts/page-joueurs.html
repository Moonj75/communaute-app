.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-block:24px 18px;min-height:160px}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.brand-t{min-width:0}
.crest{width:92px;height:92px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 3px #FFFFFF,0 6px 18px rgba(0,0,0,.35);display:block}
@media (max-width:520px){.brand{gap:12px}.crest{width:62px;height:62px;box-shadow:0 0 0 2px #FFFFFF,0 4px 12px rgba(0,0,0,.35)}}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.35);text-wrap:balance}
.brand .tag{display:inline-block;margin-top:8px;padding-top:6px;border-top:2px solid var(--gold);font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.brand p{margin:4px 0 0;font-size:14px;color:rgba(255,255,255,.9)}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.28);color:#FFFFFF;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none;position:relative}
.btn:hover{background:rgba(0,0,0,.42)}
.welcome{position:fixed;inset:0;z-index:100;background:rgba(20,10,12,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.welcome .wbox{background:var(--surface);color:var(--fg);border-radius:16px;max-width:440px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden}
.welcome .whead{background:var(--accent);color:var(--on-accent);padding:18px 20px}
.welcome .whead h2{font-family:var(--display);font-size:26px;margin:0;letter-spacing:.3px}
.welcome .whead p{margin:4px 0 0;font-size:14px;opacity:.92}
.welcome .wlist{overflow:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.welcome .wlist button{display:flex;align-items:center;gap:8px;text-align:left;padding:10px;border:1px solid var(--line2);background:var(--sunk);border-radius:10px;cursor:pointer;min-height:48px;font-weight:600;font-size:14px}
.welcome .wlist button:hover{border-color:var(--accent);background:var(--accent-soft)}
.welcome .wfoot{padding:10px 16px 14px;text-align:center;font-size:13px;color:var(--muted)}
.welcome .wfoot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
@media (max-width:380px){.welcome .wlist{grid-template-columns:1fr}}
.mewrap{position:relative;display:inline-flex}
.mewrap select{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px;width:100%}
.btn.me{gap:8px}.btn.me .av{width:24px;height:24px;font-size:10px}
.myans{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-radius:8px;font-size:14px;font-weight:600;background:var(--sunk);border:1px dashed var(--line)}
.myans.o{background:var(--yes-soft);border:1px solid var(--yes)}.myans.m{background:var(--maybe-soft);border:1px solid var(--maybe)}.myans.n{background:var(--no-soft);border:1px solid var(--no)}
.pc .mine{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.pc .mine.o{background:var(--yes);color:var(--on-yes);border:0}.pc .mine.m{background:var(--maybe);color:var(--maybe-ink);border:0}.pc .mine.n{background:var(--no-soft);color:var(--no);border:1px solid var(--no)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.primary:hover{filter:brightness(1.05)}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--on-gold);font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px #7E0A1C}
main.wrap{padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
.stamp{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.notif{background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.notif h2{font-size:18px}
.notif ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.notif li{display:flex;gap:8px;align-items:baseline;font-size:14px}
.notif li b{font-weight:700}
.notif .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lnkbtn{min-height:40px;padding:0 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer}
.lnkbtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:900px){.split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:stretch}.split>div>.cal{height:100%;box-sizing:border-box}.split .list{contain:size;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;min-width:0;box-shadow:0 1px 0 var(--line2),0 6px 16px -10px rgba(55,53,47,.25)}
h2{margin:0;font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.small{font-size:13px;color:var(--muted)}
/* calendar */
.cal{padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.cal-nav{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:20px}
.cal-nav:hover{background:var(--sunk)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.cal-g .dn{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;padding:2px 0}
.cal-d{all:unset;box-sizing:border-box;position:relative;height:38px;border-radius:8px;display:grid;place-items:center;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--fg)}
.cal-d.out{color:var(--faint);opacity:.5}
.cal-d.wk{background:var(--sunk);color:var(--muted)}
.cal-d.vac{background:var(--vac);color:var(--vac-ink)}
.cal-d.fer{box-shadow:inset 0 0 0 2px var(--fer);color:var(--fer);font-weight:800}
.cal-d.club::before{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--club)}
.cal-d.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cal-d.has{cursor:pointer;font-weight:700;background:var(--accent-soft);color:var(--accent-ink)}
.cal-d.has::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-d.sel{background:var(--accent);color:var(--on-accent)}
.fc.past{filter:grayscale(1)}
.fc.past .fc-date,.fc.past .fc-goal{filter:grayscale(1);opacity:.7}
.cal-d.sel::after{background:var(--gold)}
.cal-d.has.past,.cal-d.has.past:hover{background:var(--sunk)!important;color:var(--faint)!important;font-weight:600;pointer-events:none;cursor:default;filter:none;text-decoration:line-through;text-decoration-color:var(--faint)}
.cal-d.has.past::after{background:var(--faint)!important;opacity:.7}
.cal-d.has.past.sel{box-shadow:inset 0 0 0 1.5px var(--faint)}

.cal-d:focus-visible{outline:2px solid var(--accent)}
.cal-lg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--muted)}
.cal-lg span{display:inline-flex;align-items:center;gap:5px}
.lg{width:12px;height:12px;border-radius:3px;display:inline-block}
.lg.ev{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.lg.fer{box-shadow:inset 0 0 0 2px var(--fer)}
.lg.vac{background:var(--vac)}
.lg.club{border-radius:50%;width:8px;height:8px;background:var(--club)}
/* event card */
.fc{border-top:1px solid var(--line);margin-top:2px;padding-top:14px;display:flex;flex-direction:column;gap:12px}
.fc-top{display:flex;gap:12px;align-items:stretch}
.fc-date{flex-shrink:0;width:80px;border-radius:10px;overflow:hidden;border:1.5px solid var(--accent);display:flex;flex-direction:column;align-items:center;background:var(--surface);box-shadow:0 3px 0 var(--accent-soft)}
.fc-date .m{display:block;width:100%;text-align:center;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.12em;padding:3px 0}
.fc-date .d{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;padding-top:4px;white-space:nowrap}
.fc-date .d.rng{font-size:21px;padding-top:6px}
.fc-date .y{font-size:10px;color:var(--muted);padding:0 4px 6px;text-align:center;line-height:1.2}
.fc-id{display:flex;flex-direction:column;gap:3px;min-width:0}
.fc-cd{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.fc-cd.hot{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fc-name{font-family:var(--display);font-size:21px;font-weight:800;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.fc-line{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)}
.fc-line svg{color:var(--accent-ink);flex-shrink:0}
.fc-goal{display:flex;align-items:center;gap:12px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fc-goal b{display:block;font-family:var(--display);font-size:22px;line-height:1}
.fc-goal span{font-size:12px;color:var(--muted)}
.fc-goal .stack{flex:1;min-width:60px}
.fc-flags{display:flex;flex-wrap:wrap;gap:5px}
.fl{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;border:1px dashed var(--line);color:var(--faint)}
.fl.on{border:1px solid var(--yes);color:var(--yes);background:var(--yes-soft)}
.fl.pr{border:1px solid var(--gold);color:var(--fg);background:color-mix(in srgb,var(--gold) 18%,transparent)}

    s.innerHTML='<option value="">'+(ME?'— Changer de joueur —':'Choisis ton nom')+'</option>'+PLAYERS.map(function(p){return '<option'+(p===ME?' selected':'')+'>'+esc(p)+'</option>';}).join('');
    b.innerHTML=ME? av(ME)+'<span>Bonjour '+esc(first(ME))+'</span>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Qui es-tu ?</span>';
    f.href=FORM+(ME?'?joueur='+encodeURIComponent(ME)+'&prenom='+encodeURIComponent(first(ME)):''); }
  document.getElementById('meSel').addEventListener('change',function(){ if(!this.value) return; ME=this.value; try{ localStorage.setItem('lions-me',ME); }catch(e){} renderMe(); render(); });

  // ---- Fiche logistique (données Notion « Fiches logistiques événements ») ----
  var fsh=document.createElement('div'); fsh.className='fsh'; fsh.hidden=true; fsh.setAttribute('role','dialog'); fsh.setAttribute('aria-modal','true'); document.body.appendChild(fsh);
  function eur(n){ return (Math.round(n*100)/100).toLocaleString('fr-BE',{maximumFractionDigits:2})+' €'; }
  function fRow(k,v){ return v==null||v===''?'':'<div class="frow"><span class="k">'+esc(k)+'</span><span class="v">'+v+'</span></div>'; }
  function maps(a){ return '<a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)+'" target="_blank" rel="noopener">'+esc(a)+'</a>'; }
  function cnt(e,key){ var o={}; Object.keys(e.resp).forEach(function(p){ var r=e.resp[p]; if(r.answer!=='Oui'||!r[key]) return; String(r[key]).split(/,\s*/).forEach(function(x){ if(x) o[x]=(o[x]||0)+1; }); }); return o; }
  function chips(o){ var k=Object.keys(o); return k.length?'<div class="fchips">'+k.map(function(x){return '<span class="fchip"><b>'+o[x]+'</b>'+esc(x)+'</span>';}).join('')+'</div>':''; }
  function openFiche(key){
    var e=byKey[key]; if(!e) return; var f=e.fiche||{}, c=counts(e), w=when(e), co=f.cout||{}, ct=f.contact||{};
    var dTxt=fmt(e.date)+(e.end?' → '+fmt(e.end):'');
    var h='<div class="fsh-p"><div class="fsh-h"><div class="t"><span class="ey">Fiche logistique</span><h3>'+esc(e.name)+'</h3><span class="sub">'+esc(dTxt)+(e.lieu?' · '+esc(e.lieu):'')+(w.past?'':' · '+esc(w.t))+'</span></div><button type="button" class="fsh-x" aria-label="Fermer">'+ICO.x+'</button></div><div class="fsh-b">';
    if(!e.fiche) h+='<div class="fnote">La fiche logistique de cet évènement n’est pas encore complétée dans Notion. Les infos s’afficheront ici dès qu’elle sera remplie.</div>';
    // Lieu & accès
    var la=(f.adr?fRow('Adresse',maps(f.adr)):'')+(f.dist?fRow('Distance à parcourir',esc(f.dist)+' km'):'')+(f.heb?fRow('Hébergement',maps(f.heb)):'')+(f.dHE?fRow('Hébergement → lieu',esc(f.dHE)+' km'):'')+(f.dHC?fRow('Hébergement → centre',esc(f.dHC)+' km'):'')+(f.accHE?fRow('Accès hébergement → lieu',esc(f.accHE)):'')+(f.accEA?fRow('Accès lieu → aéroport',esc(f.accEA)):'');
    h+='<div class="fsec"><h4>'+ICO.pin+'Lieu et accès</h4>'+(la||'<span class="fempty">À compléter</span>')+'</div>';
    // Dates & dispo
    h+='<div class="fsec"><h4>'+ICO.clock+'Dates et disponibilité</h4>'+fRow('Date',esc(dTxt))+(e.limit?fRow('Réponse avant le',esc(fmt(e.limit))):'')+((f.dispo||[]).length?fRow('Disponibilité requise',esc(f.dispo.join(', '))):'')+(f.vac?fRow('Vacances scolaires','Oui'):'')+'</div>';
    // Transport
    var dep=cnt(e,'dep'), ret=cnt(e,'ret');
    h+='<div class="fsec"><h4>'+ICO.truck+'Transport</h4>'+fRow('Véhicule nécessaire',e.veh?'Oui':'Non')+fRow('Véhicules proposés',String(c.veh))+fRow('Joueurs inscrits',String(c.o))+(Object.keys(dep).length?'<span class="k" style="font-size:13px;color:var(--muted)">Départs</span>'+chips(dep):'')+(Object.keys(ret).length?'<span class="k" style="font-size:13px;color:var(--muted)">Retours</span>'+chips(ret):'')+'</div>';
    // Budget
    var car=(co.ess||0)+(co.peage||0)+(co.loc||0), air=(co.avion||0)+(co.transf||0), nights=co.hotel?(e.end?Math.max(1,Math.round((dt(e.end)-dt(e.date))/864e5)+1):1):0, hotel=(co.hotel||0)*nights;
    if(car||air||hotel){ var n=Math.max(c.o,1), pp=car/n+air+hotel;
      h+='<div class="fsec"><h4>'+ICO.euro+'Budget estimé</h4>'+(co.ess?fRow('Essence',eur(co.ess)):'')+(co.peage?fRow('Péages',eur(co.peage)):'')+(co.loc?fRow('Location voiture',eur(co.loc)):'')+(co.avion?fRow('Billet avion (par pers.)',eur(co.avion)):'')+(co.transf?fRow('Transfert aéroport (par pers.)',eur(co.transf)):'')+(co.hotel?fRow('Hôtel',eur(co.hotel)+' / nuit × '+nights):'')+
        '<div class="ftot"><span>≈ par personne'+(car?' (voiture partagée entre '+n+')':'')+'</span><b>'+eur(pp)+'</b></div>'+(f.zone?'<div class="fnote">Monnaie : '+esc(f.zone)+'</div>':'')+'</div>'; }
    // Documents
    if((f.docs||[]).length) h+='<div class="fsec"><h4>'+ICO.form+'Documents à emporter</h4><div class="fchips">'+f.docs.map(function(d){return '<span class="fchip">'+esc(d)+'</span>';}).join('')+'</div></div>';
    // Contact
    if(ct.nom||ct.tel||ct.email){ h+='<div class="fsec"><h4>'+ICO.phone+'Contact sur place</h4>'+fRow('Nom',esc(ct.nom||''))+fRow('Téléphone',ct.tel?esc(ct.tel):'')+fRow('Email',ct.email?esc(ct.email):'')+
      '<div class="fact">'+(ct.tel?'<a href="tel:'+esc(ct.tel.replace(/\s/g,''))+'">'+ICO.phone+'Appeler</a>':'')+(ct.email?'<a href="mailto:'+esc(ct.email)+'">'+ICO.mail+'Écrire</a>':'')+'</div></div>'; }
    if(f.sondage) h+='<div class="fact"><a href="'+esc(f.sondage)+'" target="_blank" rel="noopener">'+ICO.form+'Sondage</a></div>';
    h+='</div></div>';
    fsh.innerHTML=h; fsh.hidden=false; document.documentElement.style.overflow='hidden'; fsh.querySelector('.fsh-x').focus();
  }
  function closeFiche(){ fsh.hidden=true; fsh.innerHTML=''; document.documentElement.style.overflow=''; }
  fsh.addEventListener('click',function(ev){ if(ev.target===fsh||ev.target.closest('.fsh-x')) closeFiche(); });
  document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'&&!fsh.hidden) closeFiche(); if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList&&ev.target.classList.contains('flink')){ ev.preventDefault(); ev.stopPropagation(); openFiche(ev.target.getAttribute('data-fiche')); } },true);
  document.addEventListener('click',function(ev){ var b=ev.target.closest&&ev.target.closest('[data-fiche]'); if(b){ ev.preventDefault(); openFiche(b.getAttribute('data-fiche')); } });
  renderMe();
  (function(){ if(ME) return; var skip=false; try{ skip=sessionStorage.getItem('lions-skip')==='1'; }catch(e){} if(skip) return;
    var w=document.createElement('div'); w.className='welcome'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true'); w.setAttribute('aria-labelledby','wTitle');
    w.innerHTML='<div class="wbox"><div class="whead"><h2 id="wTitle">Bienvenue chez les Lions !</h2><p>Qui es-tu ? Choisis ton nom une seule fois : on s\u2019en souviendra sur cet appareil.</p></div><div class="wlist">'+PLAYERS.map(function(p){return '<button type="button" data-p="'+esc(p)+'">'+av(p)+'<span>'+esc(p)+'</span></button>';}).join('')+'</div><div class="wfoot"><button type="button" data-skip="1">Je regarde juste le calendrier</button></div></div>';
    w.addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
      if(b.getAttribute('data-skip')){ try{ sessionStorage.setItem('lions-skip','1'); }catch(err){} w.remove(); return; }
      var p=b.getAttribute('data-p'); if(!p) return; ME=PLAYERS.filter(function(x){return x===p;})[0]||p; try{ localStorage.setItem('lions-me',ME); }catch(err){} w.remove(); renderMe(); render(); });
    document.body.appendChild(w); })();
  stamp(); renderBell(); render();
})();
</script>
</body></html>
